services:
    brand-service:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                NODE_ARCH: ${NODE_ARCH:-x64}
                INSTALL_MYSQL_CLIENT: ${INSTALL_MYSQL_CLIENT:-true}
        image: legrand/brand
        container_name: brand-service
        tty: true
        restart: unless-stopped
        ports:
            -   "8000:9000"
        volumes:
            - ./:/var/www
        environment:
            - APP_NAME="Brand Service"
            - APP_ENV=local
            - APP_KEY=base64:1EF7wf3LWx2gzTNYRycL1FCS08RAJC3dt7Uj3hvE5Us=
            - APP_DEBUG=true
            - APP_URL=http://localhost:3000
            - FRONTEND_URL=http://localhost:8080
            - LOG_CHANNEL=stack
            - LOG_CHANNEL=stack
            - LOG_STACK=single
            - LOG_DEPRECATIONS_CHANNEL=null
            - LOG_LEVEL=debug
            - DB_CONNECTION=mysql
            - DB_HOST=brand-mysql
            - DB_PORT=3306
            - DB_DATABASE=brand_api
            - DB_USERNAME=root
            - DB_PASSWORD=password
            - SESSION_DRIVER=redis
            - FILESYSTEM_DISK=local
            - QUEUE_CONNECTION=redis
            - REDIS_CLIENT=phpredis
            - REDIS_HOST=brand-redis
            - REDIS_PASSWORD=null
            - REDIS_PORT=6379
            - MEDIA_DISK=public
        depends_on:
            - brand-mysql
            - brand-redis
    brand-mysql:
        image: "${MYSQL_IMAGE:-mysql:8.2}"
        container_name: brand-mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: brand_api
            MYSQL_ROOT_PASSWORD: password
        volumes:
            - dbdata:/var/lib/mysql

    brand-mysql-testing:
        image: "${MYSQL_IMAGE:-mysql:8.2}"
        container_name: brand-mysql-testing
        environment:
            MYSQL_DATABASE: brand_api
            MYSQL_ROOT_PASSWORD: password

    brand-phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: brand-phpmyadmin
        ports:
            - "8080:80"
        environment:
            PMA_HOST: brand-mysql
            PMA_PASSWORD: password
        restart: unless-stopped
        depends_on:
            - brand-mysql

    brand-redis:
        image: redis:latest
        container_name: brand-redis

volumes:
    dbdata:
        driver: local
